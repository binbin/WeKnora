<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>浏览器不受支持</title>
  <style type="text/css">
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", SimSun, Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }
    .wrap {
      max-width: 520px;
      margin: 80px auto;
      padding: 32px 28px;
      background: #fff;
      border: 1px solid #e5e7eb;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.7; margin: 0 0 10px; color: #4b5563; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>当前浏览器版本过低</h1>
    <p>免登录窗口与网页嵌入聊天需要 Internet Explorer 8 及以上，或 Chrome / Edge / Firefox 等现代浏览器。</p>
    <p>请升级浏览器后重试。IE7 及更早版本无法使用本功能。</p>
  </div>
</body>
</html>
