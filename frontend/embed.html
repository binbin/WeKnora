<!DOCTYPE html>
<html lang="en">
<head>
    <title>TreeRAG Embed</title>
    <meta charset="utf-8">
    <!-- Force Edge mode before sniff: intranet Compatibility View otherwise
         sets documentMode=7 and makes <!--[if lt IE 8]> fire on real IE9. -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <!-- IE sniff MUST run before any module scripts. -->
    <script>
    (function () {
      var ua = navigator.userAgent || '';
      var mode = document.documentMode;
      var isIE = typeof mode === 'number' || /MSIE \d/.test(ua) || /Trident\//.test(ua);
      if (!isIE) return;

      // Prefer Trident token: Compatibility View reports MSIE 7.0 + documentMode 7
      // even on IE9/10/11. Trident/5=IE9, /6=IE10, /7=IE11; Trident/4=IE8.
      function realIeVersion() {
        var trident = /Trident\/(\d+)/.exec(ua);
        if (trident) {
          return parseInt(trident[1], 10) + 4;
        }
        var msie = /MSIE (\d+)/.exec(ua);
        if (msie) {
          return parseInt(msie[1], 10);
        }
        if (typeof mode === 'number' && mode > 0) {
          return mode;
        }
        return 11;
      }

      var ieVersion = realIeVersion();
      // IE8+: jQuery legacy shell (Vue3 cannot run on IE). True IE7− tip only.
      if (ieVersion < 8) {
        location.replace('/legacy-unsupported.html');
        return;
      }
      // Guest links (/w/) use a non-frameable entry; embed keeps iframe-capable.
      var path = location.pathname + location.search + location.hash;
      var entry = path.indexOf('/w/') === 0 ? '/legacy-guest.html' : '/legacy-embed.html';
      location.replace(entry + '?p=' + encodeURIComponent(path));
    })();
    </script>
    <!-- Do NOT use <!--[if lt IE N]> redirects here: under Compatibility View
         IE9 evaluates them as IE7 and would false-positive to unsupported. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta name="renderer" content="webkit">
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <style>
      html, body, #embed-app { height: 100%; margin: 0; }
    </style>
</head>
<body>
<script>
(function(){
  document.documentElement.setAttribute('theme-mode', 'light');
  document.documentElement.style.background = '#fff';
  document.body.style.background = '#fff';
})();
</script>
<script src="/config.js"></script>
<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
<div id="embed-app"></div>
<script type="module" src="/src/embed-main.ts"></script>
</body>
</html>
