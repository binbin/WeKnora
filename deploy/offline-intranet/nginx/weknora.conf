# 宿主机 Nginx 反代到 TreeRAG frontend（127.0.0.1:18080）
# 安装：
#   sudo cp nginx/weknora.conf /etc/nginx/sites-available/weknora.conf
#   sudo ln -sf /etc/nginx/sites-available/weknora.conf /etc/nginx/sites-enabled/weknora.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 按现场修改 server_name / 证书路径。

upstream treerag_frontend {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50m;
    client_body_timeout 300s;

    # 若仅内网 HTTP，可保留；有证书时把本段改为 return 301 https://$host$request_uri;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE / 流式对话
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_pass http://treerag_frontend;
    }
}

